[tools]
vp = "latest"
nub = "latest"
sops = "latest"
supabase = "latest"
biome = "latest"

[deps]
bun = { auto = true }

[tasks]
dbsetup = { run = "supabase db push" }
dbgenerate = { run = "supabase db generate" }
build = { run = "vp build" }
lint = { run = "biome lint" }
format = { run = "biome format . --write" }
encrypt = { run = "sops -e -i .env && mv .env .env.example" }
decrypt = { run = "mv .env.example .env && sops -d -i .env " }